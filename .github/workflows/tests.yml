name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a virtual X server for the tkinter tests
        # The UI tests build real Tk windows; xvfb gives them a display
        # without one being attached to the runner.
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check montyroll tests

      - name: Run tests with coverage
        run: xvfb-run -a pytest tests/ --cov-report=xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-py${{ matrix.python-version }}
          path: tests/TEST_REPORT.md

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
