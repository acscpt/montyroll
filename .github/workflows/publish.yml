name: Publish

# Trigger on pushed version tags (e.g. v0.1.0, v1.2.3).
on:
  push:
    tags:
      - "v*"

jobs:
  # Gate the release on the full suite passing on every supported Python.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a virtual X server for the tkinter tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check montyroll tests

      - name: Run tests
        run: xvfb-run -a pytest tests/

  # Build the sdist and wheel, then publish to PyPI via the trusted publisher.
  publish:
    needs: test
    runs-on: ubuntu-latest

    # The "pypi" environment must be created in the repo settings and
    # configured as a trusted publisher on pypi.org.
    environment: pypi

    # Required for PyPI trusted publishing (OIDC); no API token needed.
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Cut a GitHub Release whose notes are the matching CHANGELOG section.
  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Extract the changelog section for this version
        run: |
          # Strip the leading 'v' from the tag (e.g. v0.1.0 -> 0.1.0).
          VERSION="${GITHUB_REF_NAME#v}"

          # Take the lines between this version's header and the next '## [' header.
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > /tmp/release_notes.md

          # Refuse to release a version with no changelog entry.
          if [ ! -s /tmp/release_notes.md ]; then
            echo "No changelog section found for version ${VERSION}"
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release_notes.md
